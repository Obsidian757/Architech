[tool.pytest.ini_options]
minversion = "7.0"
testpaths = [
    "tests",
    "advanced_ai_agents/multi_agent_apps/ai_news_and_podcast_agents/beifong/tests",
]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: tests that exercise real I/O or external services",
    "slow: tests that take more than a second",
    "requires_network: tests that need outbound network",
    "requires_api_key: tests that need a real LLM provider key",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
branch = true
source = [
    "advanced_ai_agents/multi_agent_apps/ai_news_and_podcast_agents/beifong",
]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/bootstrap_demo.py",
    "*/pack_demo.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function call in default argument is common in FastAPI
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]
"**/test_*.py" = ["B011"]
